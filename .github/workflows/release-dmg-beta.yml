name: Release Beta DMG

on:
  workflow_dispatch:

concurrency:
  group: release-beta-dmg
  cancel-in-progress: true

jobs:
  prepare-beta:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      build_number: ${{ steps.meta.outputs.build_number }}
      source_ref: ${{ steps.meta.outputs.source_ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve beta release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" != "branch" || "${GITHUB_REF_NAME}" != "alpha" ]]; then
            echo "This workflow only supports manual runs from the alpha branch. Current ref: ${GITHUB_REF_TYPE}/${GITHUB_REF_NAME}" >&2
            exit 1
          fi

          source_ref="${GITHUB_SHA}"
          build_label="alpha"
          tag="pre-release"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "${tag}" "${source_ref}"
          git push --force origin "refs/tags/${tag}"
          echo "Updated tag: ${tag} -> ${source_ref}"

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${build_label}" >> "$GITHUB_OUTPUT"
          echo "build_number=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "source_ref=${source_ref}" >> "$GITHUB_OUTPUT"

  build-dmg:
    needs: prepare-beta
    # 单 job 串行构建双架构（发布策略：不打包 mihomo 内核，保留 arm64 与 intel）：
    # 矩阵并行会在 macOS runner 池紧张时出现「整组排队被丢」（免费优先级排队上限
    # 约 15 分钟）；串行只需一个排队窗口，arm64 优先构建并顺带跑测试，intel 交叉编译随后。
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare-beta.outputs.source_ref }}

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Verify Swift toolchain
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version
          if ! swift --version | grep -Eq 'Swift version (6\.[2-9]|[7-9]\.)'; then
            echo "Swift 6.2+ is required by Package.swift (// swift-tools-version: 6.2)." >&2
            exit 1
          fi

      - name: Build both architectures serially
        shell: bash
        run: |
          set -euo pipefail
          build_one() {
            local arch="$1" suffix="$2"
            echo "::group::Build $arch ($suffix)"
            APP_VERSION="${{ needs.prepare-beta.outputs.version }}" \
            BUILD_NUMBER="${{ needs.prepare-beta.outputs.build_number }}" \
            PREPARE_MIHOMO_BINARY=0 \
            BUNDLE_MIHOMO_BINARY=0 \
            TARGET_ARCH="$arch" \
            ./Scripts/build.sh app
            # hdiutil 的 verify 在 runner 上偶发 Resource temporarily unavailable
            # （diskimages-helper 服务未就绪/未释放），重试三次并间隔等待。
            local attempt
            for attempt in 1 2 3; do
              if APP_VERSION="${{ needs.prepare-beta.outputs.version }}" \
                 DMG_SUFFIX="$suffix" \
                 ./Scripts/build.sh dmg; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "DMG creation failed after 3 attempts ($suffix)." >&2
                exit 1
              fi
              echo "DMG attempt $attempt failed; retrying in 30s…"
              sleep 30
            done
            echo "::endgroup::"
          }
          build_one arm64 apple-silicon
          build_one x86_64 intel
          ls -la dist/

      # 测试与构建同 runner（仅一次排队）；失败即 job 失败，阻塞 release。
      - name: Run Swift tests
        # 12 分钟超时：个别测试在 runner 上可能 hang（无内置 per-test 超时），
        # 超时杀掉后日志可取，用于精确定位卡点。
        timeout-minutes: 12
        run: swift test --no-parallel

      - name: Upload dmg artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dmg-both-arch
          path: |
            dist/*.dmg
            dist/*.dmg.sha256
          if-no-files-found: error

  release:
    needs: [prepare-beta, build-dmg]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare-beta.outputs.source_ref }}

      - name: Download dmg artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: dmg-*
          merge-multiple: true
          path: dist

      - name: Generate beta release body
        shell: bash
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          SOURCE_BRANCH: alpha
        run: |
          chmod +x Scripts/generate_beta_release_notes.sh
          Scripts/generate_beta_release_notes.sh \
            "${{ needs.prepare-beta.outputs.tag }}" \
            "${{ needs.prepare-beta.outputs.version }}" \
            release.md

      - name: Publish beta release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare-beta.outputs.tag }}
          target_commitish: ${{ needs.prepare-beta.outputs.source_ref }}
          name: ClashBarX ${{ needs.prepare-beta.outputs.version }}
          body_path: release.md
          prerelease: true
          fail_on_unmatched_files: true
          files: |
            dist/*.dmg
